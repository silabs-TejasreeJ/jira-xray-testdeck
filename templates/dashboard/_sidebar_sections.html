{# Section tree for Plan / Execution sidebars #}
<div class="tree" id="sectionTreeInner" data-partial-nav>
  {% if view_mode == "plan" %}
    <a href="?technology={{ technology|urlencode }}&stack={{ stack_name|urlencode }}&release={{ release_name|urlencode }}{% if selected_execution %}&execution={{ selected_execution }}{% endif %}{% if filters.status %}&status={{ filters.status }}{% endif %}{% if filters.search %}&search={{ filters.search|urlencode }}{% endif %}"
       class="{% if not section_path %}active{% endif %}">
      <span>All Tests</span>
      <span class="count">{{ total_cases }}</span>
    </a>
  {% else %}
    <a href="{% url 'execution_detail' execution.key %}?technology={{ technology|urlencode }}{% if filters.status %}&status={{ filters.status }}{% endif %}{% if filters.search %}&search={{ filters.search|urlencode }}{% endif %}"
       class="{% if not section_path %}active{% endif %}">
      <span>All Tests</span>
      <span class="count">{{ total_cases }}</span>
    </a>
  {% endif %}
  {% include "dashboard/_section_tree.html" with nodes=sections %}
</div>
