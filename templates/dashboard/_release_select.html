{# Shared release_name filter — searchable via data-searchable. #}
<select id="{{ select_id|default:'release' }}" name="release"
        class="{{ select_class|default:'' }}"
        data-searchable
        data-placeholder="{{ placeholder|default:'All releases' }}"
        {% if onchange %}onchange="{{ onchange }}"{% endif %}
        style="{{ select_style|default:'' }}">
  <option value="">{% if not selected_release %}selected{% endif %}>{{ placeholder|default:"All releases" }}</option>
  {% for opt in RELEASE_OPTIONS %}
    <option value="{{ opt }}"
      {% if selected_release == opt %}selected{% endif %}>{{ opt }}</option>
  {% endfor %}
</select>
